<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — 밀폐공간 안전 관제 시스템</title>
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#0E1116; --panel:#161B22; --border:#232A33; --field:#2E3744;
    --text:#E6EAF0; --muted:#9AA4B2; --label:#C9D1DB;
    --blue:#5B9CF6; --red:#F2545B;
  }
  html, body {
    min-height:100%; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;
  }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px 16px; }
  .card {
    width:100%; max-width:400px; background:var(--panel);
    border:1px solid var(--border); border-radius:16px; padding:36px 32px;
    display:flex; flex-direction:column; gap:18px;
  }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:8px; color:var(--blue); }
  .brand h1 { font-size:20px; font-weight:700; color:var(--text); }
  .brand-sub { font-size:13px; color:var(--muted); }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:13px; color:var(--label); }
  .field input {
    min-height:46px; border-radius:10px; border:1px solid var(--field);
    background:var(--bg); color:var(--text); padding:0 14px;
    font:inherit; font-size:15px; outline:none;
  }
  .field input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(91,156,246,.2); }
  .field input::placeholder { color:#5F6B7A; }
  .login-btn {
    min-height:48px; border:0; border-radius:10px; margin-top:4px;
    background:var(--blue); color:#071426; font:inherit; font-weight:700; font-size:15px; cursor:pointer;
  }
  .login-btn:hover { background:#7AAFF8; }
  .login-btn:disabled { opacity:.6; cursor:wait; }
  .login-btn:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  .error-msg { font-size:13px; color:var(--red); min-height:20px; text-align:center; }
  .foot { border-top:1px solid var(--border); padding-top:16px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<form class="card" id="login-form" novalidate>
  <div class="brand">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
    <div><h1>SafetyMonitor</h1><div class="brand-sub">밀폐공간 통합 안전 관제</div></div>
  </div>
  <div class="field">
    <label for="username">아이디</label>
    <input type="text" id="username" autocomplete="username" placeholder="관리자 아이디">
  </div>
  <div class="field">
    <label for="password">비밀번호</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="비밀번호">
  </div>
  <button type="submit" class="login-btn" id="login-btn">로그인</button>
  <div class="error-msg" id="error-msg" role="alert"></div>
  <div class="foot">CAPSTONE DESIGN 2026 · IRIS 팀</div>
</form>
<script>
  document.getElementById("login-form").addEventListener("submit", e => { e.preventDefault(); doLogin(); });
  async function doLogin() {
    const id  = document.getElementById("username").value.trim();
    const pw  = document.getElementById("password").value;
    const err = document.getElementById("error-msg");
    if (!id || !pw) { err.textContent = "아이디와 비밀번호를 입력해주세요."; return; }

    const btn = document.getElementById("login-btn");
    btn.disabled = true;
    try {
      const response = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: new URLSearchParams({username: id, password: pw})
      });
      const result = await response.json();
      if (response.ok && result.success) {
        window.location.href = "/dashboard";
      } else {
        err.textContent = result.message;
        document.getElementById("password").value = "";
      }
    } catch {
      err.textContent = "서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.";
      document.getElementById("password").value = "";
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
