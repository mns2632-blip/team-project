<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — 밀폐공간 안전 관제 시스템</title>
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
<form class="card" id="login-form" novalidate>
  <div class="brand">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
    <div><h1>SafetyMonitor</h1><div class="brand-sub">밀폐공간 통합 안전 관제</div></div>
  </div>
  <div class="field">
    <label for="username">아이디</label>
    <input type="text" id="username" autocomplete="username" placeholder="관리자 아이디">
  </div>
  <div class="field">
    <label for="password">비밀번호</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="비밀번호">
  </div>
  <button type="submit" class="login-btn" id="login-btn">로그인</button>
  <div class="error-msg" id="error-msg" role="alert"></div>
  <div class="foot">CAPSTONE DESIGN 2026 · IRIS 팀</div>
</form>
<script src="/static/js/login.js"></script>
</body>
</html>
