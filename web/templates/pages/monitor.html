<!-- 메인 (실시간 관제) -->
<div class="main page-view active" id="page-monitor">

  <!-- 요약 카드 -->
  <div class="summary-bar">
    <div class="summary-card clickable" id="card-temp" onclick="openSide('temp')">
      <div class="sc-icon temp"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z"/></svg></div>
      <div>
        <div class="sc-label">온도</div>
        <div><span class="sc-val temp" id="temp-val">--.-</span><span class="sc-unit">°C</span></div>
        <div class="sc-badge ok" id="temp-badge">정상</div>
        <div class="sc-meter"><i id="temp-meter"></i></div>
        <div class="sc-thr" id="temp-thr"></div>
      </div>
    </div>
    <div class="summary-card clickable" id="card-humid" onclick="openSide('humid')">
      <div class="sc-icon humid"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7l5.7 5.6a8 8 0 1 1-11.4 0z"/></svg></div>
      <div>
        <div class="sc-label">습도</div>
        <div><span class="sc-val humid" id="humid-val">--.-</span><span class="sc-unit">%RH</span></div>
        <div class="sc-badge ok" id="humid-badge">정상</div>
        <div class="sc-meter"><i id="humid-meter"></i></div>
        <div class="sc-thr" id="humid-thr"></div>
      </div>
    </div>
    <div class="summary-card clickable" id="card-gas" onclick="openSide('gas')">
      <div class="sc-icon gas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9z"/></svg></div>
      <div>
        <div class="sc-label">가스 농도</div>
        <div><span class="sc-val gas" id="gas-val">---</span><span class="sc-unit">ppm</span></div>
        <div class="sc-badge ok" id="gas-badge">정상</div>
        <div class="sc-meter"><i id="gas-meter"></i></div>
        <div class="sc-thr" id="gas-thr"></div>
      </div>
    </div>
    <div class="summary-card clickable" onclick="goPage('thermal')">
      <div class="sc-icon thermal"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3.3.3 1.4 1.2 2.8 2.5 2.8z"/></svg></div>
      <div>
        <div class="sc-label">열화상 최고 온도</div>
        <div><span class="sc-val thermal" id="kpi-th-val">--.-</span><span class="sc-unit">°C</span></div>
        <div class="sc-badge ok" id="kpi-th-badge">대기 중</div>
        <div class="sc-meter"><i id="kpi-th-meter"></i></div>
        <div class="sc-thr">주의 45 · 위험 60°C</div>
      </div>
    </div>
  </div>

  <!-- 중단 -->
  <div class="mid-row">

    <!-- 영상 -->
    <div class="video-panel">
      <div class="panel-head">
        <div class="panel-title">
          AI 탐지 영상
          <span style="font-size:12px;color:var(--gray500);font-weight:400;">CAM-00 · /dev/video0</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="sc-badge ok" id="ai-badge" style="margin:0;">AI <span id="ai-status">정상</span></span>
          <div class="panel-badge-live"><div class="live-dot"></div>LIVE</div>
        </div>
      </div>
      <div class="video-wrap">
        <img src="/video_feed" alt="AI Camera Feed" onload="document.getElementById('cam-offline-msg').style.display='none'" onerror="document.getElementById('cam-offline-msg').style.display='flex'">
        <div id="cam-offline-msg" style="position:absolute;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#94A3B8;font-size:13px;">
        카메라 오프라인
        </div>
        <div class="video-info">
          <div class="vinfo-chip" id="cam-fps">-- fps</div>
          <div class="vinfo-chip">YOLOv8 + MediaPipe</div>
        </div>
      </div>
      <div class="det-banner" id="det-banner">
        <span id="det-text">정상 — 이상 행동이 감지되지 않았습니다.</span>
      </div>
    </div>

    <!-- 평면도 -->
    <div class="map-panel">
      <div class="panel-head">
        <div class="panel-title">센서 위치 (평면도)</div>
      </div>
      <canvas class="fp-canvas" id="floorplan"></canvas>
    </div>

  </div>

  <!-- 하단 -->
  <div class="bot-row" style="grid-template-columns:1fr 1fr;">

    <!-- 센서 차트 -->
    <div class="chart-panel">
      <div class="panel-head">
        <div class="panel-title">실시간 센서 그래프</div>
      </div>
      <div class="chart-tabs">
        <div class="ctab active" id="ctab-temp"  onclick="switchChart('temp')">온도</div>
        <div class="ctab"        id="ctab-humid" onclick="switchChart('humid')">습도</div>
        <div class="ctab"        id="ctab-gas"   onclick="switchChart('gas')">가스</div>
      </div>
      <div class="chart-body">
        <canvas id="sensor-chart" height="200"></canvas>
      </div>
    </div>

    <!-- 이벤트 로그 -->
    <div class="log-panel">
      <div class="panel-head">
        <div class="panel-title">이벤트 로그</div>
        <span style="font-size:11px;color:var(--gray400);">최근 10개</span>
      </div>
      <div class="log-body" id="log-body"></div>
    </div>

  </div>
</div>


<!-- 사이드 패널 -->
<div class="side-panel" id="side-panel">
  <div class="side-head">
    <div class="side-title" id="side-title">온도 상세</div>
    <button class="side-close" onclick="closeSide()">✕</button>
  </div>
  <div class="side-body">
    <div class="stat-grid3">
      <div class="stat3 mn"><div class="stat3-label">최솟값</div><div class="stat3-val" id="stat-min">--</div></div>
      <div class="stat3 av"><div class="stat3-label">평균</div><div class="stat3-val" id="stat-avg">--</div></div>
      <div class="stat3 mx"><div class="stat3-label">최댓값</div><div class="stat3-val" id="stat-max">--</div></div>
    </div>
    <div>
      <div class="side-section-title">실시간 추이</div>
      <canvas id="side-chart" height="140"></canvas>
    </div>
    <div>
      <div class="side-section-title">이상 감지 이력</div>
      <div id="alert-list"><div style="font-size:12px;color:var(--gray400);padding:8px 0;">이상 감지 이력 없음</div></div>
    </div>
  </div>
</div>
